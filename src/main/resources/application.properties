spring.datasource.username=${MYSQL_USERNAME:root}
spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MySQLDialect
spring.datasource.password=${MYSQL_PASSWORD:w@mi$ho@1995#}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# MYSQL DATABASE


logging.level.org.springframework.security=DEBUG


# EMAIL CONFIG
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST}
spring.mail.protocol=smtp


# GOOGLE OAUTH
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# GEMINI FAIR VALUE SUGGESTION
liwatch.gemini.api-key=${GEMINI_API_KEY:}
liwatch.gemini.model=gemini-2.5-flash

# FRONTEND BASE URL FOR REDIRECTS / CORS
liwatch.frontend.url=${FRONTEND_URL:http://localhost:3000}
liwatch.backend.url=${BACKEND_URL:http://localhost:8080}
